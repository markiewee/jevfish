[project]
name = "jevfish"
version = "0.1.0"
description = "JevFish: a MiroFish-style swarm prediction engine where TypeSafe Jev makes every agent decision"
authors = [
    { name = "Mark Wee", email = "markwee99@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "camel-ai==0.2.78",
    "camel-oasis==0.2.5",
    "flask>=3.0",
    "mcp==1.24.0",
    "openai>=1.0",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "typesafe-sdk>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
]

[project.scripts]
jevfish = "jevfish.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls real Jev and a real LLM; needs keys; run with -m live"]
